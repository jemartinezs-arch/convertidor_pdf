<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 50px auto;
            background: #f4f6f8;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        form {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            margin-top: 20px;
            padding: 12px;
            width: 100%;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #43a047;
        }

        .info {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #555;
        }
    </style>
</head>
<body>

<h1>📬 Contáctanos</h1>

<form action="https://formspree.io/f/meeoyjol" method="POST">
    <label>Nombre</label>
    <input type="text" name="nombre" required>

    <label>Email</label>
    <input type="email" name="email" required>

    <label>Mensaje</label>
    <textarea name="mensaje" rows="5" required></textarea>

    <!-- protección anti spam -->
    <input type="text" name="_gotcha" style="display:none">

    <button type="submit">Enviar mensaje</button>

    <input type="hidden" name="_subject" value="Nuevo mensaje desde Convertidor PDF">
    <input type="hidden" name="_template" value="table">
    <input type="hidden" name="_next" value="/contact?success=1">


</form>


<div class="info">
    También puedes escribirnos directamente a:<br>
    📧 <strong>convertidorpdfa@gmail.com</strong>
</div>
<footer style="
    text-align:center;
    margin-top:40px;
    font-size:14px;
    color:#666;
">
    © 2026 Convertidor PDF Online ·
    <a href="/privacy">Privacidad</a> ·
    <a href="/terms">Términos</a> ·
    <a href="/contact">Contacto</a>
</footer>

</body>
</html>
